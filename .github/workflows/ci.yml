name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Mocha grep pattern; empty runs the full suite'
        required: false
        default: ''

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One red leg must not cancel the others: every leg's own result is
      # required, so we need the full picture from a single run.
      fail-fast: false
      matrix:
        arch:
          - x64
          - x86
        node:
          - 10
          - 12
          - 14
          - 16
          - 18
          - 19
        os:
          - macOS-latest
          - ubuntu-latest
          - windows-latest
        exclude:
          - arch: x86
            os: macOS-latest
          - arch: x86
            os: ubuntu-latest
          - arch: x86
            node: 18
            os: windows-latest
          - node: 10
            os: macOS-latest
          - node: 12
            os: macOS-latest
          - node: 14
            os: macOS-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # macOS-latest is arm64 now. Forcing the matrix's x64 Node there runs
          # it under Rosetta 2, where Node 18.20.8's bundled npm 10.8.2 aborts
          # with "async hook stack has become corrupted" during `npm install`.
          # Use the runner's native architecture on macOS; x64/x86 elsewhere.
          architecture: ${{ matrix.os == 'macOS-latest' && 'arm64' || matrix.arch }}
      - run: npm install
      - name: Run tests
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx mocha --throw-deprecation --grep "${{ inputs.test-filter }}" test/*.test.js
          else
            npm test
          fi
      - name: Pack the release tarball
        if:
          matrix.os == 'ubuntu-latest' && matrix.node == 18 && matrix.arch ==
          'x64'
        run: npm pack
      - uses: actions/upload-artifact@v4
        if:
          matrix.os == 'ubuntu-latest' && matrix.node == 18 && matrix.arch ==
          'x64'
        with:
          name: npm-tarball
          path: '*.tgz'
          if-no-files-found: error
